version: '3.8'
services:
  backend:
    build: ./Movies
    command: daphne -b 0.0.0.0 -p 8000 Movies.asgi:application
    volumes:
      - ./Movies:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - redis
    environment:
      - DJANGO_SETTINGS_MODULE=Movies.settings
  redis:
    image: redis:7
    ports:
      - "6379:6379"
  frontend:
    build: ./films
    ports:
      - "3000:3000"
    volumes:
      - ./films:/app
    stdin_open: true
    tty: true
