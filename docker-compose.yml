# =============================================================================
# Recommendation System — Production Docker Compose
# =============================================================================
version: '3.8'

services:
  # ── PostgreSQL Database ────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: movies-postgres
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-movies}
      POSTGRES_USER: ${DATABASE_USER:-movies}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-movies} -d ${DATABASE_NAME:-movies}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - movies-network

  # ── Redis Cache & Celery Broker ────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: movies-redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - movies-network

  # ── Django Backend ─────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: movies-backend
    environment:
      - SECRET_KEY=${SECRET_KEY}
      - DEBUG=False
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - DATABASE_URL=postgresql://${DATABASE_USER:-movies}:${DATABASE_PASSWORD}@postgres:5432/${DATABASE_NAME:-movies}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS}
      - TMDB_API_KEY=${TMDB_API_KEY}
      - SENTRY_DSN=${SENTRY_DSN}
      - DJANGO_LOG_LEVEL=INFO
      - SECURE_HSTS_SECONDS=31536000
      - SECURE_SSL_REDIRECT=True
      - COOKIE_SECURE=True
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - movies-network
    restart: unless-stopped

  # ── Celery Worker ──────────────────────────────────────────────────────────
  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: movies-celery-worker
    command: celery -A Movies worker -l info -Q default,recommendations
    environment:
      - SECRET_KEY=${SECRET_KEY}
      - DEBUG=False
      - DATABASE_URL=postgresql://${DATABASE_USER:-movies}:${DATABASE_PASSWORD}@postgres:5432/${DATABASE_NAME:-movies}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - TMDB_API_KEY=${TMDB_API_KEY}
      - SENTRY_DSN=${SENTRY_DSN}
      - DJANGO_LOG_LEVEL=INFO
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - movies-network
    restart: unless-stopped

  # ── Celery Beat (Scheduled Tasks) ──────────────────────────────────────────
  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: movies-celery-beat
    command: celery -A Movies beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    environment:
      - SECRET_KEY=${SECRET_KEY}
      - DEBUG=False
      - DATABASE_URL=postgresql://${DATABASE_USER:-movies}:${DATABASE_PASSWORD}@postgres:5432/${DATABASE_NAME:-movies}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - TMDB_API_KEY=${TMDB_API_KEY}
      - SENTRY_DSN=${SENTRY_DSN}
      - DJANGO_LOG_LEVEL=INFO
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - movies-network
    restart: unless-stopped

  # ── Frontend (Nginx + React) ───────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: movies-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - movies-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  movies-network:
    driver: bridge