services:
  - type: web
    name: movies-backend
    env: docker
    dockerfilePath: ./Movies/Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    envVars:
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://your-frontend-vercel-url.vercel.app" # The user must update this
      - key: DATABASE_URL
        sync: false # The user will add this in the Render dashboard manually for security
      - key: REDIS_URL
        sync: false # The user will add this in the Render dashboard manually for security
      - key: SECRET_KEY
        generateValue: true
      - key: TMDB_API_KEY
        sync: false # User must provide TMDB key manually
