services:
  - type: web
    name: movie-recommender-api
    env: python
    buildCommand: |
      pip install -r requirements.txt
      python Movies/manage.py migrate
      python Movies/manage.py collectstatic --noinput
    startCommand: gunicorn Movies.wsgi:application --bind 0.0.0.0:$PORT --workers 4
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://movie-recommender-frontend.vercel.app,http://localhost:3000"
      - key: TMDB_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: movie-recommender-db
          property: connectionString
      - key: COOKIE_SECURE
        value: "True"

databases:
  - name: movie-recommender-db
    databaseName: movies
    plan: free
