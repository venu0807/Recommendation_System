version: '3.8'

services:
  frontend:
    build:
      context: ./films
      dockerfile: Dockerfile
    ports:
      - "80:80"
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      - backend

  backend:
    build:
      context: .
      dockerfile: Movies/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=Movies.settings
      - REDIS_URL=redis://redis:6379/0
      - DB_HOST=db
      - DB_NAME=movies
      - DB_USER=moviesuser
      - DB_PASSWORD=securepassword123
      - CORS_ALLOWED_ORIGINS=http://localhost,http://127.0.0.1,http://localhost:3000
    depends_on:
      - redis
      - db
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health/"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:7-alpine
    expose:
      - "6379"
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis_data:/data

  db:
    image: mysql:8.0
    environment:
      - MYSQL_DATABASE=movies
      - MYSQL_USER=moviesuser
      - MYSQL_PASSWORD=securepassword123
      - MYSQL_ROOT_PASSWORD=rootpassword123
    volumes:
      - mysql_data:/var/lib/mysql
    restart: always
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    expose:
      - "3306"

volumes:
  redis_data:
  mysql_data:
